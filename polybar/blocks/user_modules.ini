;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Flat right-hand side, modelled on Omarchy's waybar: one glyph per module,
;; no block colours, detail one click away. Polybar has no tooltips, so state
;; is carried by which glyph is shown and by its colour.
;;
;; All glyphs are Nerd Fonts v2 (Material Design, F500-FD46). The installed
;; iosevka_nerd_font.ttf has no v3 range (F0000+), so Omarchy's own codepoints
;; would render as empty boxes.

;; Active internet connection. See scripts/network.sh
[module/network-status]
type = custom/script

exec = ~/.config/polybar/blocks/scripts/network.sh
interval = 5
tail = false

format = <label>
format-padding = 2
label = %output%

click-left = ~/.config/polybar/blocks/scripts/popup-window.sh Nm-connection-editor 520 460 nm-connection-editor &
click-right = ~/.config/polybar/blocks/scripts/popup-window.sh Nm-connection-editor 520 460 nm-connection-editor &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Bluetooth controller state. See scripts/bluetooth.sh
[module/bluetooth]
type = custom/script

exec = ~/.config/polybar/blocks/scripts/bluetooth.sh
interval = 10
tail = false

format = <label>
format-padding = 2
label = %output%

click-left = ~/.config/polybar/blocks/scripts/popup-window.sh Blueman-manager 640 460 blueman-manager &
click-right = ~/.config/polybar/blocks/scripts/bluetooth.sh --toggle &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; System monitor button. Omarchy's cpu module is a static glyph that opens
;; btop; btop is not installed here, so this opens htop in alacritty.
[module/sysmon]
type = custom/text

content = %{T2}%{T-}
content-padding = 2
content-foreground = ${color.foreground}

click-left = ~/.config/polybar/blocks/scripts/popup-window.sh polybar-sysmon 900 560 alacritty --class polybar-sysmon,polybar-sysmon -e htop &
click-right = ~/.config/polybar/blocks/scripts/popup-window.sh polybar-sysmon 900 560 alacritty --class polybar-sysmon,polybar-sysmon -e htop &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Collapse the system tray behind a chevron, like waybar's
;; group/tray-expander. Polybar has no drawer, but its tray lives in its own
;; top-level X window, so the window is unmapped instead.
;; Kept first in modules-right so the drawer opens into the empty bar to its
;; left instead of shoving the icons and the clock along - see the script.
;; custom/script, not custom/ipc: the script has to push the tray back down
;; whenever an app remaps it by adding an icon, so it runs a loop of its own
;; and --toggle signals it to redraw immediately.
[module/tray-expander]
type = custom/script

exec = ~/.config/polybar/blocks/scripts/tray-toggle.sh
; The script is its own loop so a click redraws at once; interval is only the
; delay before polybar restarts it should it ever die.
tail = true
interval = 1

format = <label>
label = %output%
format-padding = 2
format-foreground = ${color.foreground}

click-left = ~/.config/polybar/blocks/scripts/tray-toggle.sh --toggle &

